<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feet and Inch Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="shooting-stars"></div>
<div class="container">

    <h1>Calculator to calculate feet and inch</h1>

    <!-- Number One -->
    <div class="input-row">

        <label>Num one</label>

        <input type="number" id="feet1" placeholder="Feet">
        <span>Feet</span>

        <input type="number" id="inch1" placeholder="Inch">
        <span>Inch</span>

    </div>


    <!-- Number Two -->
    <div class="input-row">

        <label>Num two</label>

        <input type="number" id="feet2" placeholder="Feet">
        <span>Feet</span>

        <input type="number" id="inch2" placeholder="Inch">
        <span>Inch</span>

    </div>


    <!-- Multiplication -->
    <div class="multiplication">

        <span>Mul</span>

        <span class="box" id="showNum1">0</span>

        <span>×</span>

        <span class="box" id="showNum2">0</span>

        <span>=</span>

        <span class="box" id="showResult">0</span>

    </div>


    <!-- Output -->
    <div class="output-row">

        <label>Output:</label>

        <div class="output-box" id="output">
            0 feet 0 inch
        </div>

    </div>


    <!-- Feet Information -->
    <div class="feet-section">

        <h2>Feet = 12 inch</h2>

        <div class="faces">
            <div>😊</div>
            <div>😊</div>
            <div>😊</div>
        </div>

    </div>

</div>

  <!-- Anime Dance Section -->
<div class="anime-dance">
    <h2>Anime Dance 🎵</h2>

    <div class="dancers">
        <img src="anime1.gif" alt="Anime dancer">
        <img src="anime2.gif" alt="Anime dancer">
        <img src="anime3.gif" alt="Anime dancer">
    </div>
</div><audio id="bgMusic" loop>
    <source
        src="song.mp3"
        type="audio/mpeg">
</audio>

<button id="musicButton">🎵 Play Music</button>
<script src="script.js"></script>

</body>
</html>
